<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Jurnali</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1115;--panel:#181b22;--panel2:#12141a;--line:#2a2f3a;--text:#e6e8ee;--muted:#8a90a0;
--green:#22c55e;--red:#ef4444;--gray:#64748b;--blue:#3b82f6;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0}
.btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--red)}
.btn.small{padding:5px 10px;font-size:12px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px;font-family:inherit;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.muted{color:var(--muted)}
.small-txt{font-size:12px}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}
a{color:var(--blue);text-decoration:none}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:20px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.card .value{font-size:22px;font-weight:600;margin-top:6px}

.chart-card{margin:0 24px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.chart-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chart-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chart-controls select{width:auto}
.chart-controls .inl{width:150px}
.chart-box{position:relative;height:300px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:0 24px 12px;align-items:center}
.toolbar select{width:auto}
.search{flex:1;min-width:200px}

.table-wrap{overflow-x:auto;margin:0 24px 40px;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1350px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--panel2);color:var(--muted);font-weight:500;position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#1c2029}
.badge{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.long{background:var(--green)}.short{background:var(--red)}
.tp{background:var(--green)}.loss{background:var(--red)}.be{background:var(--gray)}
.tag{background:#2a2f3a;border-radius:6px;padding:3px 8px;font-size:12px;color:#cbd5e1}
.arg-SMC{background:#f59e0b33;color:#fbbf24}
.arg-OB{background:#f9731633;color:#fb923c}
.arg-OF{background:#ef444433;color:#f87171}
.arg-D{background:#f5c94233;color:#fde047}
.empty{text-align:center;color:var(--muted);padding:30px}

/* Modal (new trade) */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:720px}

/* Side drawer (edit trade) */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:60;transform:translateX(105%);transition:transform .25s ease;overflow-y:auto}
.drawer.show{transform:none}
.modal-head,.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px;position:sticky;top:0;background:var(--panel);z-index:2}

/* Form */
.tf{padding:18px 20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.full{grid-column:1/-1}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.linkrow{display:flex;gap:8px;align-items:center}
.linkrow input{flex:1}
.upload-row{display:flex;gap:8px;flex-wrap:wrap}
.upl{cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.thumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0b0d11;height:120px}
.thumb img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;display:block}
.thumb .kind{position:absolute;left:6px;bottom:6px;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.75)}
.thumb .rm{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.75);border:0;color:#fff;border-radius:6px;padding:2px 7px;cursor:pointer}
.tf .foot{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.tf .foot .right{display:flex;gap:8px}

/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:95vw;max-height:92vh;object-fit:contain;border-radius:8px}

@media (max-width:640px){
  .fields{grid-template-columns:1fr}
  .chart-controls .inl{width:120px}
  .chart-card,.toolbar,.stats{margin-left:12px;margin-right:12px}
  .table-wrap{margin-left:12px;margin-right:12px}
}
</style>
</head>
<body>

<header>
  <h1>📈 Trading Jurnali</h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn ghost" onclick="exportJSON()">Eksport</button>
    <label class="btn ghost" style="cursor:pointer">Import
      <input type="file" accept=".json" onchange="importJSON(event)" hidden>
    </label>
    <button class="btn" onclick="openNew()">+ Yangi savdo</button>
  </div>
</header>

<section class="stats">
  <div class="card"><div class="label">Jami savdo</div><div class="value" id="sTotal">0</div></div>
  <div class="card"><div class="label">Win rate</div><div class="value" id="sWin">0%</div></div>
  <div class="card"><div class="label">Umumiy foyda</div><div class="value" id="sProfit">$0</div></div>
  <div class="card"><div class="label">O'rtacha R/R</div><div class="value" id="sRR">0</div></div>
  <div class="card"><div class="label">TP / Loss / BU</div><div class="value" id="sBreakdown">0 / 0 / 0</div></div>
</section>

<section class="chart-card">
  <div class="chart-head">
    <div>
      <h2>Equity Curve</h2>
      <div class="muted small-txt" style="margin-top:4px" id="chartSummary"></div>
    </div>
    <div class="chart-controls">
      <label class="muted small-txt" style="display:flex;align-items:center;gap:6px">Boshlang'ich balans ($)
        <input type="number" id="startBal" class="inl" step="0.01" value="0" oninput="onStartBalChange()">
      </label>
      <select id="period" onchange="renderChart()">
        <option value="all">Barcha vaqt</option>
        <option value="thismonth">Shu oy</option>
      </select>
    </div>
  </div>
  <div class="chart-box"><canvas id="equityChart"></canvas></div>
</section>

<div class="toolbar">
  <input class="search" id="search" placeholder="Juftlik yoki izoh bo'yicha qidirish..." oninput="render()">
  <select id="fResult" onchange="render()">
    <option value="">Barcha natija</option>
    <option>Take Profit</option><option>Loss</option><option>BU</option>
  </select>
  <select id="fPos" onchange="render()">
    <option value="">Barcha pozitsiya</option>
    <option>Long</option><option>Short</option>
  </select>
  <select id="fArg" onchange="render()">
    <option value="">Barcha argument</option>
    <option>SMC</option><option>Order block</option><option>Order flow</option><option>Discount</option><option>Boshqa</option>
  </select>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Sana</th><th>Juftlik</th><th>Pozitsiya</th><th>Kirish narx</th><th>Chiqish narx</th>
        <th>Kirish link</th><th>Chiqish link</th><th>Argument</th><th>Risk %</th><th>R/R</th>
        <th>Foyda</th><th>Natija</th><th>Izoh</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">Savdolar yo'q. "+ Yangi savdo" tugmasini bosing.</div>
</div>

<!-- New trade modal -->
<div class="modal-bg" id="newModal" onclick="if(event.target===this) closeEditor()">
  <div class="modal">
    <div class="modal-head">
      <h2>+ Yangi savdo</h2>
      <button class="btn ghost small" onclick="closeEditor()">✕</button>
    </div>
    <div id="newRoot"></div>
  </div>
</div>

<!-- Side drawer (edit trade) -->
<div class="overlay" id="overlay" onclick="closeEditor()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">Savdo</h2>
    <button class="btn ghost small" onclick="closeEditor()">✕</button>
  </div>
  <div id="editRoot"></div>
</aside>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" alt="">
</div>

<script>
const KEY = 'trading-journal-v1';            // same key as before, so existing data is kept
const START_KEY = 'trading-journal-start-balance';
const GREEN = '#22c55e', RED = '#ef4444', MUTED = '#8a90a0';

const SAMPLE = [
  {id:1,date:'2025-08-26',pair:'STCUSDT',position:'Long',before:'',after:'',argument:'SMC',risk:1,rr:1.3,profit:-10,result:'Loss',comment:'',shots:[]},
  {id:2,date:'2025-08-29',pair:'GRAMUSDT',position:'Long',before:'',after:'',argument:'Order block',risk:1,rr:1.3,profit:30,result:'Take Profit',comment:'normal',shots:[]},
  {id:3,date:'2025-09-01',pair:'SOLANAUSDT',position:'Long',before:'',after:'',argument:'SMC',risk:1,rr:1.3,profit:-10,result:'Loss',comment:'hissiyot',shots:[]},
  {id:4,date:'2025-09-08',pair:'BTCUSDT',position:'Long',before:'',after:'',argument:'Order block',risk:1,rr:1.3,profit:0,result:'BU',comment:'hissiyot',shots:[]},
  {id:5,date:'2025-09-18',pair:'HYPEUSDT',position:'Long',before:'',after:'',argument:'Order flow',risk:1,rr:1.3,profit:-10,result:'Loss',comment:'kayfiyat',shots:[]},
  {id:6,date:'2025-09-24',pair:'SOLANAUSDT',position:'Long',before:'',after:'',argument:'SMC',risk:1,rr:1.8,profit:34,result:'Take Profit',comment:'hissiyot',shots:[]},
  {id:7,date:'2025-10-03',pair:'BNBUSDT',position:'Long',before:'',after:'',argument:'Order flow',risk:1,rr:1.8,profit:-10,result:'Loss',comment:'',shots:[]},
  {id:8,date:'2025-10-05',pair:'LINKUSDT',position:'Long',before:'',after:'',argument:'Discount',risk:1,rr:1.3,profit:25,result:'Take Profit',comment:'',shots:[]}
];

let trades = load();
let equityChart = null;
let current = {mode:null, id:null, shots:[]};  // currently open editor
const forms = {};                               // {new: <form>, edit: <form>}

/* ================= STORAGE ================= */
function migrate(t){
  if(!Array.isArray(t.shots)){
    t.shots = [];
    if(t.beforeImg) t.shots.push({kind:'before', src:t.beforeImg});
    if(t.afterImg)  t.shots.push({kind:'after',  src:t.afterImg});
  }
  delete t.beforeImg;
  delete t.afterImg;
  return t;
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(d)) return d.map(migrate);
  }catch(e){}
  return SAMPLE.map(t => ({...t}));
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(trades));
    return true;
  }catch(e){
    alert("Xotira to'ldi (rasmlar juda katta bo'lishi mumkin). Ba'zi skrinshotlarni o'chirib ko'ring yoki JSON eksport qiling.");
    return false;
  }
}

/* ================= HELPERS ================= */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n){
  const v = Number(n) || 0;
  return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
}
function num(s, def = 0){
  if(s === '' || s === null || s === undefined) return def;
  const n = parseFloat(s);
  return isNaN(n) ? def : n;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function resultClass(r){ return r === 'Take Profit' ? 'tp' : r === 'Loss' ? 'loss' : 'be'; }
function argClass(a){
  if(a === 'SMC') return 'arg-SMC';
  if(a === 'Order block') return 'arg-OB';
  if(a === 'Order flow') return 'arg-OF';
  if(a === 'Discount') return 'arg-D';
  return 'tag';
}
function linkCell(url){
  return url
    ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">↗ Ochish</a>`
    : '<span class="muted">—</span>';
}
function priceCell(v){
  return (v === '' || v === null || v === undefined) ? '<span class="muted">—</span>' : esc(v);
}
function sortedAsc(list){
  return list.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'') || a.id - b.id);
}

/* ================= TABLE & STATS ================= */
function filtered(){
  const q  = document.getElementById('search').value.trim().toLowerCase();
  const fr = document.getElementById('fResult').value;
  const fp = document.getElementById('fPos').value;
  const fa = document.getElementById('fArg').value;
  return trades
    .filter(t => !q || (t.pair + ' ' + (t.comment||'')).toLowerCase().includes(q))
    .filter(t => !fr || t.result === fr)
    .filter(t => !fp || t.position === fp)
    .filter(t => !fa || t.argument === fa)
    .sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.id - a.id);
}

function renderStats(){
  const n = trades.length;
  const tp = trades.filter(t => t.result === 'Take Profit').length;
  const loss = trades.filter(t => t.result === 'Loss').length;
  const bu = trades.filter(t => t.result === 'BU').length;
  const total = trades.reduce((s,t) => s + (Number(t.profit)||0), 0);
  const rr = n ? trades.reduce((s,t) => s + (Number(t.rr)||0), 0) / n : 0;
  const decided = tp + loss;
  const win = decided ? Math.round(tp / decided * 100) : 0;

  document.getElementById('sTotal').textContent = n;
  document.getElementById('sWin').textContent = win + '%';
  const pEl = document.getElementById('sProfit');
  pEl.textContent = money(total);
  pEl.className = 'value ' + (total >= 0 ? 'pos' : 'neg');
  document.getElementById('sRR').textContent = rr.toFixed(2);
  document.getElementById('sBreakdown').textContent = `${tp} / ${loss} / ${bu}`;
}

function render(){
  renderStats();
  const rows = filtered();
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('tbody').innerHTML = rows.map(t => `
    <tr onclick="openEdit(${t.id})">
      <td>${esc(t.date)}</td>
      <td><strong>${esc(t.pair)}</strong></td>
      <td><span class="badge ${t.position === 'Long' ? 'long' : 'short'}">${esc(t.position)}</span></td>
      <td>${priceCell(t.entry)}</td>
      <td>${priceCell(t.exit)}</td>
      <td>${linkCell(t.before)}</td>
      <td>${linkCell(t.after)}</td>
      <td><span class="tag ${argClass(t.argument)}">${esc(t.argument)}</span></td>
      <td>${Number(t.risk||0).toFixed(1)}%</td>
      <td>${Number(t.rr||0).toFixed(1)}</td>
      <td class="${Number(t.profit) < 0 ? 'neg' : 'pos'}">${money(t.profit)}</td>
      <td><span class="badge ${resultClass(t.result)}">${esc(t.result)}</span></td>
      <td>${esc(t.comment)}${(t.shots && t.shots.length) ? ` <span title="Skrinshotlar">🖼${t.shots.length}</span>` : ''}</td>
      <td><button class="btn danger small" onclick="event.stopPropagation(); deleteTrade(${t.id})">🗑</button></td>
    </tr>`).join('');
}

/* ================= EQUITY CURVE ================= */
function initChart(){
  const summary = document.getElementById('chartSummary');
  if(typeof Chart === 'undefined'){
    summary.textContent = "Grafik yuklanmadi. Internet ulanishini tekshiring va sahifani yangilang.";
    return;
  }
  const ctx = document.getElementById('equityChart');
  equityChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Balans',
        data: [],
        borderColor: GREEN,
        borderWidth: 2.5,
        tension: 0.25,
        fill: false,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBorderColor: '#0f1115',
        pointBackgroundColor: [],
        // Segment color: green when the balance went up, red when it went down
        segment: {
          borderColor: c => (c.p1.parsed.y >= c.p0.parsed.y ? GREEN : RED)
        }
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {mode: 'index', intersect: false},
      plugins: {
        legend: {display: false},
        tooltip: {callbacks: {label: c => 'Balans: ' + money(c.parsed.y)}}
      },
      scales: {
        x: {ticks: {color: MUTED, maxRotation: 45, autoSkip: true}, grid: {color: '#2a2f3a'}},
        y: {ticks: {color: MUTED, callback: v => '$' + v}, grid: {color: '#2a2f3a'}}
      }
    }
  });
  renderChart();
}

function updateMonthOptions(){
  const sel = document.getElementById('period');
  const cur = sel.value;
  const months = [...new Set(trades.map(t => (t.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  sel.innerHTML =
    '<option value="all">Barcha vaqt</option>' +
    '<option value="thismonth">Shu oy</option>' +
    months.map(m => `<option value="${m}">${m}</option>`).join('');
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : 'all';
}

function renderChart(){
  if(!equityChart) return;
  updateMonthOptions();

  const period = document.getElementById('period').value;
  const startBal = num(document.getElementById('startBal').value, 0);
  const all = sortedAsc(trades);
  const curMonth = todayStr().slice(0,7);

  const inPeriod = t => {
    if(period === 'all') return true;
    if(period === 'thismonth') return (t.date||'').startsWith(curMonth);
    return (t.date||'').startsWith(period);
  };
  const list = all.filter(inPeriod);

  // Balance at the start of the period = starting balance + all profits before the first trade of the period
  const firstIdx = list.length ? all.indexOf(list[0]) : 0;
  const base = startBal + all.slice(0, firstIdx).reduce((s,t) => s + (Number(t.profit)||0), 0);

  const labels = [period === 'all' ? 'Boshlanish' : 'Davr boshi'];
  const data = [Number(base.toFixed(2))];
  const colors = [MUTED];
  let bal = base;
  list.forEach(t => {
    const p = Number(t.profit) || 0;
    bal += p;
    labels.push(`${t.date} ${t.pair}`);
    data.push(Number(bal.toFixed(2)));
    colors.push(p >= 0 ? GREEN : RED);
  });

  equityChart.data.labels = labels;
  equityChart.data.datasets[0].data = data;
  equityChart.data.datasets[0].pointBackgroundColor = colors;
  equityChart.update();

  const periodResult = bal - base;
  document.getElementById('chartSummary').innerHTML =
    `${list.length} ta savdo · Davr natijasi: <span class="${periodResult >= 0 ? 'pos' : 'neg'}">${money(periodResult)}</span> · Yakuniy balans: ${money(bal)}`;
}

function onStartBalChange(){
  try{ localStorage.setItem(START_KEY, document.getElementById('startBal').value); }catch(e){}
  renderChart();
}

/* ================= FORM (shared markup for new & edit) ================= */
function formHTML(mode){
  return `
<form class="tf" autocomplete="off">
  <div class="fields">
    <label class="fld">Sana <input type="date" name="date" required></label>
    <label class="fld">Juftlik <input type="text" name="pair" placeholder="BTCUSDT" required></label>
    <label class="fld">Pozitsiya
      <select name="position"><option>Long</option><option>Short</option></select>
    </label>
    <label class="fld">Argument
      <select name="argument">
        <option>SMC</option><option>Order block</option><option>Order flow</option><option>Discount</option><option>Boshqa</option>
      </select>
    </label>
    <label class="fld">Kirish narxi <input type="number" step="any" name="entry" placeholder="0.00"></label>
    <label class="fld">Chiqish narxi <input type="number" step="any" name="exit" placeholder="0.00"></label>
    <label class="fld">Risk % <input type="number" step="0.1" name="risk"></label>
    <label class="fld">R/R <input type="number" step="0.1" name="rr"></label>
    <label class="fld">Foyda ($) <input type="number" step="0.01" name="profit"></label>
    <label class="fld">Natija
      <select name="result"><option>Take Profit</option><option>Loss</option><option>BU</option></select>
    </label>
  </div>

  <div class="sec-title">Linklar (TradingView)</div>
  <label class="fld full">Kirish linki (Before)
    <div class="linkrow">
      <input type="url" name="before" placeholder="https://www.tradingview.com/...">
      <button type="button" class="btn ghost small" data-open="before">↗ Ochish</button>
    </div>
  </label>
  <label class="fld full">Chiqish linki (After)
    <div class="linkrow">
      <input type="url" name="after" placeholder="https://www.tradingview.com/...">
      <button type="button" class="btn ghost small" data-open="after">↗ Ochish</button>
    </div>
  </label>

  <div class="sec-title">Skrinshotlar</div>
  <div class="upload-row">
    <label class="btn ghost small upl">📷 Before rasm
      <input type="file" accept="image/*" multiple data-kind="before" hidden>
    </label>
    <label class="btn ghost small upl">📷 After rasm
      <input type="file" accept="image/*" multiple data-kind="after" hidden>
    </label>
  </div>
  <div class="gallery"></div>

  <label class="fld full" style="margin-top:18px">Izoh
    <textarea name="comment" placeholder="Savdo haqida izoh..."></textarea>
  </label>

  <div class="foot">
    ${mode === 'edit'
      ? '<button type="button" class="btn danger" data-act="delete">O\'chirish</button>'
      : '<span></span>'}
    <div class="right">
      <button type="button" class="btn ghost" data-act="cancel">Bekor qilish</button>
      <button type="submit" class="btn">Saqlash</button>
    </div>
  </div>
</form>`;
}

function mountForms(){
  ['new','edit'].forEach(mode => {
    const root = document.getElementById(mode === 'new' ? 'newRoot' : 'editRoot');
    root.innerHTML = formHTML(mode);
    const form = root.querySelector('form');
    forms[mode] = form;

    form.addEventListener('submit', e => { e.preventDefault(); submitForm(); });

    form.addEventListener('click', e => {
      const open = e.target.closest('[data-open]');
      if(open){
        const url = form.elements[open.dataset.open].value.trim();
        if(url) window.open(url, '_blank', 'noopener,noreferrer');
        return;
      }
      const act = e.target.closest('[data-act]');
      if(!act) return;
      if(act.dataset.act === 'cancel') closeEditor();
      if(act.dataset.act === 'delete') deleteTrade(current.id, true);
    });

    form.addEventListener('change', e => {
      if(e.target.matches('input[type="file"]')) addFiles(e.target);
    });

    form.querySelector('.gallery').addEventListener('click', e => {
      const z = e.target.closest('[data-zoom]');
      if(z){ openLightbox(current.shots[+z.dataset.zoom].src); return; }
      const r = e.target.closest('[data-rm]');
      if(r){ current.shots.splice(+r.dataset.rm, 1); renderGallery(); }
    });
  });
}

function fillForm(mode, t){
  const f = forms[mode];
  for(const el of f.elements){
    if(!el.name) continue;
    const v = t[el.name];
    el.value = (v === undefined || v === null) ? '' : v;
  }
}

function renderGallery(){
  if(!current.mode) return;
  const gal = forms[current.mode].querySelector('.gallery');
  gal.innerHTML = current.shots.length
    ? current.shots.map((s,i) => `
        <div class="thumb">
          <img src="${s.src}" data-zoom="${i}" alt="${s.kind}">
          <span class="kind">${s.kind === 'before' ? 'Before' : 'After'}</span>
          <button type="button" class="rm" data-rm="${i}" title="O'chirish">✕</button>
        </div>`).join('')
    : '<div class="muted small-txt">Hali skrinshot yo\'q</div>';
}

/* ================= IMAGES ================= */
function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addFiles(input){
  const kind = input.dataset.kind;
  const files = [...input.files];
  input.value = '';
  for(const file of files){
    try{
      const src = await compressImage(file);
      current.shots.push({kind, src});
    }catch(e){
      alert("Rasmni o'qib bo'lmadi: " + file.name);
    }
  }
  renderGallery();
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}

/* ================= OPEN / CLOSE EDITORS ================= */
function openNew(){
  current = {mode:'new', id:null, shots:[]};
  fillForm('new', {
    date: todayStr(), pair:'', position:'Long', argument:'SMC',
    entry:'', exit:'', risk:1, rr:1.3, profit:0, result:'Take Profit',
    before:'', after:'', comment:''
  });
  renderGallery();
  document.getElementById('newModal').classList.add('show');
  document.body.style.overflow = 'hidden';
  forms.new.pair.focus();
}

function openEdit(id){
  const t = trades.find(x => x.id === id);
  if(!t) return;
  current = {mode:'edit', id, shots: t.shots.map(s => ({...s}))};
  fillForm('edit', t);
  renderGallery();
  document.getElementById('drawerTitle').textContent = `${t.pair} · ${t.date}`;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeEditor(){
  document.getElementById('newModal').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
  current = {mode:null, id:null, shots:[]};
}

/* ================= SAVE / DELETE ================= */
function submitForm(){
  const mode = current.mode;
  if(!mode) return;
  const f = forms[mode];
  const v = n => f.elements[n].value;

  const data = {
    date: v('date'),
    pair: v('pair').trim().toUpperCase(),
    position: v('position'),
    argument: v('argument'),
    entry: v('entry') === '' ? '' : num(v('entry')),
    exit:  v('exit')  === '' ? '' : num(v('exit')),
    risk: num(v('risk')),
    rr: num(v('rr')),
    profit: num(v('profit')),
    result: v('result'),
    before: v('before').trim(),
    after: v('after').trim(),
    comment: v('comment').trim(),
    shots: current.shots.slice()
  };

  if(!data.date || !data.pair){
    alert("Sana va juftlik majburiy.");
    return;
  }

  if(mode === 'edit'){
    const i = trades.findIndex(t => t.id === current.id);
    if(i > -1) trades[i] = {...trades[i], ...data};
  }else{
    trades.push({id: Date.now(), ...data});
  }

  if(!save()) return;
  closeEditor();
  render();
  renderChart();
}

function deleteTrade(id, fromEditor = false){
  if(id === null || id === undefined) return;
  if(!confirm("Bu savdoni o'chirasizmi?")) return;
  trades = trades.filter(t => t.id !== id);
  save();
  if(fromEditor) closeEditor();
  render();
  renderChart();
}

/* ================= IMPORT / EXPORT ================= */
function exportJSON(){
  const blob = new Blob([JSON.stringify(trades, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trading-journal-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('bad');
      trades = data.map(t => migrate({...t, id: t.id ?? Date.now() + Math.random()}));
      if(!save()) return;
      render();
      renderChart();
    }catch(err){
      alert("Fayl noto'g'ri formatda.");
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* ================= INIT ================= */
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(document.getElementById('lightbox').classList.contains('show')) closeLightbox();
  else closeEditor();
});

try{
  const sb = localStorage.getItem(START_KEY);
  if(sb !== null) document.getElementById('startBal').value = sb;
}catch(e){}

mountForms();
render();
initChart();
</script>
